[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "roblox_pe"
version = "0.2.1"
description = "Inspect, diff, and extract build signatures from Roblox PE binaries"
readme = "README.md"
authors = [{ name = "Alex", email = "alex@local" }]
requires-python = ">=3.10"
dependencies = [
    "pefile>=2023.2.7",
    "requests>=2.31.0",
    "rich>=13.0.0",
]

[project.scripts]
roblox-pe = "roblox_pe.cli:main"

[tool.setuptools.packages.find]
include = ["roblox_pe*"]
